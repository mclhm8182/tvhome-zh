plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    // Upstream builds against 34; we compile against 35 (the platform installed here). Nothing in the
    // launcher needs an API that 34 does not have.
    compileSdk 35

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '1.8.0'
    }

    buildTypes {
        release {
            // Same switch upstream uses: R8 strips and optimises the code (AndroidX included),
            // resource shrinking drops what the launcher never references.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a
            // debug build instead of fighting it.
            signingConfig signingConfigs.debug
        }
    }

    signingConfigs {
        debug {
            storeFile file('/Users/tom/.workbuddy/binaries/tvhome-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    lint {
        // The launcher is sideloaded over ADB, never published to Google Play, so Play's minimum targetSdk
        // does not apply; without this, lintVitalRelease fails assembleRelease.
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
}
